[package]
name = "picacho"
version = "0.1.0"
edition = "2024"
description = "Picacho: a fast, native email client for macOS, Windows, and Linux"
license = "MIT"
# mail-auth 0.14 and later need mail-parser 1.0, which needs Rust 1.98;
# protected_email_bridge (Proton Mail without Bridge) needs Rust 1.100.
rust-version = "1.100"

# Android loads the app as a shared library from its activity (src/android.rs);
# iOS links it as a static library into its app (src/ios.rs, built by
# scripts/bundle-ios.sh with `--crate-type staticlib`). On other systems the
# library is empty and the `picacho` binary is the app.
[lib]
name = "picacho"
path = "src/mobile.rs"
crate-type = ["cdylib"]

[dependencies]
aes-gcm = "0.11"
anyhow = "1"
argon2 = "0.6"
base64 = "0.23"
# Embed Blitz without its standalone window/event loop or unrestricted network client.
# `floats`: gpui-pre turns on taffy's float layout, which stylo_taffy must fill in.
# `complex-scripts`: word and line breaks for Chinese, Japanese, Thai, Khmer,
# Lao and Burmese (ICU4X's dictionaries and models), without which a long
# press selected whole lines of Japanese and Thai text didn't wrap.
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts", "svg", "woff", "floats", "complex-scripts"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
blitz-traits = "=0.3.0-beta.4"
# Computed styles of the email's elements (positions, overflow, backgrounds).
style = { package = "stylo", version = "=0.22.0" }
percent-encoding = "2"
encoding_rs = "0.8"
idna = "1"
rustls-native-certs = "0.8"
# Words of Chinese, Japanese, Thai and other scripts written without spaces,
# for the reader's word selection (the same dictionaries Blitz's text uses).
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
anyrender = "0.14"
# Print and Save as PDF (display/html/print.rs): the email, laid out and
# painted by Blitz as the reader shows it, written as vector PDF pages with
# its fonts (subset) and images.
krilla = { version = "0.8", default-features = false, features = ["raster-images"] }
# Fonts' character maps, so text in those PDFs can be copied and searched;
# the version krilla uses.
skrifa = "0.42"
anyrender_vello_cpu = { version = "0.18", default-features = false }
peniko = "0.6"
# The font collection the HTML reader shares across emails (see
# display/html/document.rs); blitz's `system-fonts` already builds its backends.
fontique = { version = "0.12", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga", "pnm", "qoi", "hdr"] }
# Previewing SVG attachments in the reader (display/tools.rs).
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"] }
bytemuck = "1"
chrono = { version = "0.4", features = ["serde"] }
# Time zones named in calendar invitations (sync/ical.rs).
chrono-tz = "0.10"
# This computer's time zone by name, on every system (new events keep it).
iana-time-zone = "0.1"
# Repeating events, the whole of RFC 5545's RRULE (sync/ical.rs).
rrule = "0.14"
cursor-icon = "1"
directories = "6"
# IMAP COMPRESS=DEFLATE (RFC 4978): raw deflate over the TLS stream.
flate2 = "1"
futures = "0.3"
data-url = "0.3"
keyboard-types = "0.8"
kurbo = "0.13"
# GPUI from the gpui-pre snapshots of Zed; its platforms are separate crates
# (gpui-platform on desktop, gpui-mobile on Android). gpui-component 0.9.1
# pins gpui-pre =0.3.12.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "=0.9.1"
# Names the input state shared by single- and multi-line fields.
gpui-base = "=0.9.1"
gpui-component-assets = { package = "gpui-kit-assets", version = "=0.9.1" }
hkdf = "0.13"
# SASL sign-in: HMAC for SCRAM and CRAM-MD5, and their hashes.
hmac = "0.13"
# Tokio runs mail-auth's DNS lookups (hickory) for checking senders.
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
imap = "2.4"
# Parses responses that imap 2.4 cannot (CONDSTORE SELECT, Gmail ids, extensions); patched below.
imap-proto = "=0.10.2"
# Keyring 4's default features (its `v1` set, left on here) keep keyring 3's
# stores: Keychain, Credential Manager and the Secret Service, which finds
# items saved by keyring 3 by service and user.
keyring = "4"
# Builds messages (MIME); Picacho speaks SMTP itself (sync/smtp.rs).
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname"] }
# Checks DKIM, SPF and DMARC. Pure-Rust crypto, without aws-lc's C build.
mail-auth = { version = "0.15", default-features = false, features = ["rust-crypto", "dns-hickory", "arc"] }
# mail-auth's resolver, with DNSSEC validation (ring, already linked) for the
# separate resolver that checks TLSA, OPENPGPKEY and SMIMEA (sync/auth.rs).
hickory-resolver = { version = "=0.26.3", features = ["dnssec-ring"] }
# 0.17 and later limit MIME nesting; deeply nested parts used to overflow the stack.
mailparse = "0.18"
markdown = "1.0.0"
# Pasting with formatting: copied HTML becomes the composer's Markdown.
htmd = "0.5"
# The formatted composer's document read from HTML (manage/richtext): drafts
# written in other apps, pasted formatting, signatures. The versions htmd
# already links.
html5ever = "0.38"
markup5ever_rcdom = "0.38"
# Moving by characters and words in the formatted composer.
unicode-segmentation = "1"
md-5 = "0.11"
# Finding a forwarded original in an outgoing message (already a
# dependency of several crates here).
memchr = "2"
# Attachment content types from their file names.
mime_guess = "2"
# The public suffix list: a trusted link site is never a shared suffix such
# as blogspot.com, whose subdomains belong to different people.
psl = "2"
native-tls = "0.2"
notify-rust = "4.19"
open = "5"
pgp = "0.21"
# S/MIME (manage/smime.rs): PKCS#7 and PKCS#12, from the OpenSSL already
# linked for native-tls and Proton's push encryption.
openssl = "0.10"
# Proton Mail without Bridge: Proton's API (SRP sign-in, keys, sync, send),
# used directly by sync/proton.rs. Its IMAP/SMTP listeners are not started.
protected_email_bridge = { git = "https://github.com/pinaltech/Protected-Email-Bridge" }
webauthn-rs-proto = "=0.6.2"
# The QR code a phone scans to sign in with its passkey.
qrcode = { version = "0.14", default-features = false }
rand = "0.10"
# The rand pgp takes, for signing and encrypting outgoing mail (manage/openpgp.rs).
rand08 = { package = "rand", version = "0.8" }
# CardDAV answers (WebDAV XML), for the address book.
roxmltree = "0.21"
# Finds candidate sign-in codes for the local model (Local AI).
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "native-tls", "system-proxy"] }
# The proxy settings reqwest follows (`system-proxy`), read the same way, so
# email images can tell a corporate proxy from a local address
# (display/html/resources.rs).
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy", "client-proxy-system"] }
http = "1"
# fallible_uint: sizes and counts bind as integers, failing rather than wrapping when too large.
# SQLCipher rather than plain SQLite, for the optional encrypted database
# (Settings → Privacy, manage/vault.rs). Without a key it reads and writes
# ordinary SQLite files, so unencrypted databases are unchanged. Its crypto is
# the system's: OpenSSL's libcrypto on Linux, CommonCrypto on macOS and iOS;
# Android and Windows build OpenSSL in (below).
rusqlite = { version = "0.42", features = ["bundled-sqlcipher", "fallible_uint", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
# The system's language: the interface's (i18n), and typed dates' and print
# page sizes'.
sys-locale = "0.3.2"
# The interface's text in each language (src/i18n, locales/): Fluent
# messages, with each language's plural rules.
fluent-bundle = "0.16"
unic-langid = "0.9"
fluent-langneg = "0.13"
sha2 = "0.11"
unicode-normalization = "0.1"
url = "2"
# Removes tracking from links in mail; its rule catalog is in assets/url-sanitize.
url-sanitize-core = "2.4"
# Tracking numbers: each carrier's formats and check digits, from the
# tracking_number_data catalog (see manage/parcels.rs).
tracking-numbers = "0.1.2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
# The i18n tests read the message files' syntax (src/i18n/tests.rs).
fluent-syntax = "0.12"

[features]
# Offers a fictional sample inbox from onboarding, for development and screenshots.
sample-data = []
# Offers Pinal Mail when adding an account: sign in with Pinal Accounts and
# its tokens open the mailbox. Build with --no-default-features to hide it;
# existing Pinal accounts keep working either way.
pinal = []
default = ["pinal"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

# The HTML reader parses, lays out and rasterizes on the CPU; unoptimized,
# one screen of an email takes ~50x longer. Optimize just those crates in
# development builds so debug runs reflect real reading speed.
# The UI framework lays out and paints the whole window on each frame;
# optimize it too, so debug builds show real frame cost.
[profile.dev.package.gpui-pre]
opt-level = 2
[profile.dev.package.gpui-component]
opt-level = 2
[profile.dev.package.vello_cpu]
opt-level = 3
[profile.dev.package.vello_common]
opt-level = 3
[profile.dev.package.fearless_simd]
opt-level = 3
[profile.dev.package.anyrender]
opt-level = 3
[profile.dev.package.anyrender_vello_cpu]
opt-level = 3
[profile.dev.package."blitz-dom"]
opt-level = 3
[profile.dev.package."blitz-paint"]
opt-level = 3
[profile.dev.package."blitz-html"]
opt-level = 3
[profile.dev.package.html5ever]
opt-level = 3
[profile.dev.package.stylo]
opt-level = 3
[profile.dev.package.selectors]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
[profile.dev.package.parley]
opt-level = 3
[profile.dev.package.parley_engine]
opt-level = 3
[profile.dev.package.harfrust]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package."read-fonts"]
opt-level = 3
[profile.dev.package.kurbo]
opt-level = 3
[profile.dev.package.peniko]
opt-level = 3
[profile.dev.package."tiny-skia-path"]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package."zune-jpeg"]
opt-level = 3
[profile.dev.package.glifo]
opt-level = 3
[profile.dev.package.color]
opt-level = 3
[profile.dev.package.cssparser]
opt-level = 3
[profile.dev.package.markup5ever]
opt-level = 3
[profile.dev.package.string_cache]
opt-level = 3
[profile.dev.package.tendril]
opt-level = 3
[profile.dev.package.fontique]
opt-level = 3
[profile.dev.package.fontdb]
opt-level = 3
[profile.dev.package.servo_arc]
opt-level = 3
[profile.dev.package.hashbrown]
opt-level = 3
[profile.dev.package.smallvec]
opt-level = 3
[profile.dev.package.bytemuck]
opt-level = 3
[profile.dev.package.icu_segmenter]
opt-level = 3
[profile.dev.package."unicode-bidi"]
opt-level = 3
[profile.dev.package.atomic_refcell]
opt-level = 3
[profile.dev.package.euclid]
opt-level = 3
[profile.dev.package.app_units]
opt-level = 3

# build.rs: Windows' icon and version resource (windres or RC.EXE). The
# version GPUI uses for its manifest. Build dependencies follow the host,
# so this is built for every target and used only for Windows.
[build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Unlike gpui 0.2, the platforms leave text and Linux windowing to features:
# without `font-kit` macOS draws no text, and without `wayland` or `x11`
# Linux opens no window.
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "wayland", "x11"] }
# Proton's human verification (CAPTCHA) in the system's own webview
# (WKWebView, WebView2, WebKitGTK), in a window of its own; see display/verify.rs.
tao = "0.34"
wry = "0.53"
# Proton sign-in with a security key or passkey (WebAuthn/FIDO2): USB keys,
# and a phone's passkey by QR code and Bluetooth (caBLE); Windows Hello below.
webauthn-authenticator-rs = { version = "0.6.2", features = ["usb", "cable"] }
# The clipboard's HTML, for pasting with formatting: GPUI reads only its text.
# Wayland's data-control protocol where the compositor has it, else X11.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

# Kerberos sign-in (sync/gss.rs): the system's GSS-API library, loaded
# when first used, so builds need no Kerberos headers and computers without
# Kerberos run as before. Windows uses SSPI (windows-sys, below).
[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
libloading = "0.8"

# Spelling in the formatted composer on Linux and the BSDs (manage/spelling.rs):
# the Hunspell dictionaries desktop apps install. macOS and Windows use the
# system's spellchecker.
[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios", target_os = "macos"))))'.dependencies]
spellbook = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
# GPUI's Android platform: the window, input, text and wgpu renderer.
# `vibration`: haptic feedback for the phone presentation's gestures.
gpui-mobile = { git = "https://github.com/pinaltech/Picacho-Patches", branch = "vendor-split-dev", default-features = false, features = ["vibration"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
log = "0.4"
# Android has no system OpenSSL; build it into the app.
native-tls = { version = "0.2", features = ["vendored"] }
# SQLCipher's crypto from that same built-in OpenSSL.
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }
# keyring's own Entry has no Android store; credentials go to the app's
# SharedPreferences, encrypted with an Android Keystore key, through
# keyring-core directly (manage/store.rs).
keyring-core = "1"
android-native-keyring-store = "1"
# The app's Java side (android/app/src/main/java): its background mail
# service and notifications, called both ways (src/android.rs). The same
# versions android-activity and gpui-mobile use.
jni = "0.22"
ndk-context = "0.1"
# Proton's security keys over USB and NFC: CTAP2 here, the USB and NFC I/O
# through the Java side (sync/fido/android.rs).
webauthn-authenticator-rs = { version = "0.6.2", features = ["ctap2"] }
# Its `Token` trait, implemented for those keys.
async-trait = "0.1"

[target.'cfg(target_os = "ios")'.dependencies]
# GPUI's iOS platform: the UIKit window, touch and keyboard input, Core Text
# and the wgpu (Metal) renderer. The Xcode host app is packaging/ios.
# `vibration`: haptic feedback for the phone presentation's gestures.
gpui-mobile = { git = "https://github.com/pinaltech/Picacho-Patches", branch = "vendor-split-dev", default-features = false, features = ["vibration"] }
log = "0.4"
# keyring's own Entry has no iOS store; credentials go to the app's
# Keychain (Protected Data) through keyring-core directly (manage/store.rs).
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["protected"] }
# UIPasteboard's HTML and RTF, for pasting with formatting (display/paste_ios.rs);
# the version gpui-mobile uses.
objc2 = "0.6"
# The app lock's Face ID or Touch ID prompt (display/biometric.rs).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
# Proton's security keys over NFC (Core NFC, packaging/ios/SecurityKeys.swift)
# and a passkey on another phone by QR code and Bluetooth (caBLE): CTAP2
# here, the NFC I/O through the Swift side (ios/keys.rs).
webauthn-authenticator-rs = { version = "0.6.2", features = ["ctap2", "cable"] }
# Its `Token` trait, implemented for those keys.
async-trait = "0.1"

# The app lock's Touch ID, Face ID or Optic ID (display/biometric.rs): the
# LocalAuthentication framework, which answers on a queue of its own.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LABiometryType", "LAError"] }
block2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# Debug builds only: the development driver captures the app's own window.
core-graphics = "0.24"
# Debug builds only: the development driver sends the window real mouse events.
objc = "0.2"
# Local AI runs its models with Core ML.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSPrintInfo", "NSPrintOperation", "NSView", "NSResponder", "NSGraphicsContext", "NSSpellChecker"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSRange", "NSBundle", "NSData", "NSDictionary", "NSError", "NSFileManager", "NSString", "NSURL", "NSValue", "NSObject"] }
objc2-core-ml = { version = "0.3", default-features = false, features = ["std", "MLModel", "MLModel_MLModelCompilation", "MLFeatureProvider", "MLDictionaryFeatureProvider", "MLMultiArray", "MLFeatureValue", "MLModelConfiguration"] }

[target.'cfg(windows)'.dependencies]
# Windows Hello: the system's own passkeys and security keys.
webauthn-authenticator-rs = { version = "0.6.2", features = ["win10"] }
# Windows has no system OpenSSL (S/MIME and Proton's push encryption use
# it): build it into the app, as on Android.
openssl = { version = "0.10", features = ["vendored"] }
# SQLCipher's crypto from that same built-in OpenSSL.
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }
# display/windows.rs: the AppUserModelID, the delay-loaded DLLs' checks,
# the animations setting and the data directory's access list. The
# versions GPUI and keyring already use.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    # Kerberos sign-in through SSPI (sync/gss.rs).
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_Security_Authorization",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # High contrast's state (display/motion.rs, prefers-contrast in emails).
    "Win32_UI_Accessibility",
] }
windows-registry = "0.6"
# Spelling in the formatted composer (manage/spelling.rs): Windows' spell
# checking API. The version GPUI already uses.
windows = { version = "0.62", features = ["Win32_Globalization", "Win32_System_Com"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
# The tray (menu bar) icon while Picacho runs in the background (display/tray.rs).
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# GPUI enables Fontconfig's dlopen API; select the matching API in Blitz's font backend.
fontique = { version = "0.12", features = ["fontconfig-dlopen"] }
# The tray icon while Picacho runs in the background (display/tray.rs):
# a StatusNotifierItem over D-Bus, without GTK.
ksni = { version = "0.3", features = ["blocking"] }
# glibc's allocator settings and malloc_trim, to keep the background's
# memory small (manage/memory.rs).
libc = "0.2"
# The desktop portal's print dialog (Print) and Open With dialog (OpenURI
# with `ask`), also inside Flatpak, and its Background request, which starts
# Picacho at sign-in from inside Flatpak; the version GPUI already uses.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "background", "open_uri", "print"] }

[patch.crates-io]
# Patched crates, one folder each with its patches and README:
# https://github.com/pinaltech/Picacho-Patches
# After changing that repository, run `cargo update -p gpui` to use it here.
# An email's unresolvable image or link address no longer panics; text in
# padded inline blocks and centered cells is hit (selected, clicked) where shown;
# blocks directly in a table (columns restacked for phones) are laid out.
# TEMPORARY: the fix/blitz-table-block-children branch (with its email
# legacy attributes and media device pixel ratio patches), pinned to a
# published commit, until it is merged; then back to the vendor-split-dev
# git dependency and `cargo update -p blitz-dom -p blitz-paint`. Never a
# `path` outside this repository: CI couldn't build it, and releases would
# come from an unpublished local tree (`scripts/check-patches.sh`).
# The HTML reader needs blitz-dom's `set_media_device_pixel_ratio` (0007).
blitz-dom = { git = "https://github.com/juliaoverflow/Picacho-Patches", rev = "382f207c209d1fcb3946cfb0aee492df2172d36a" }
# Inline boxes paint gradient backgrounds (emails' dark styles); SVG images
# are drawn in layers the dark recoloring recognizes (`is_image_layer`).
blitz-paint = { git = "https://github.com/juliaoverflow/Picacho-Patches", rev = "382f207c209d1fcb3946cfb0aee492df2172d36a" }
# prefers-reduced-motion and prefers-contrast media queries (Media Queries 5
# §11.3, §11.4), which blitz-dom's `set_media_preferences` sets.
# TEMPORARY, as blitz-dom above: the fix/blitz-table-block-children
# branch, pinned, until it is merged; then the git dependency like stylo_derive's.
stylo = { git = "https://github.com/juliaoverflow/Picacho-Patches", rev = "382f207c209d1fcb3946cfb0aee492df2172d36a" }
stylo_atoms = { git = "https://github.com/juliaoverflow/Picacho-Patches", rev = "382f207c209d1fcb3946cfb0aee492df2172d36a" }
# ToCss error inference with GPUI's log/serde feature.
stylo_derive = { git = "https://github.com/pinaltech/Picacho-Patches", branch = "vendor-split-dev" }
# Parses Gmail's X-GM-MSGID and thread ids, OBJECTID, PREVIEW, SAVEDATE,
# BINARY, ESEARCH, SORT, THREAD and QRESYNC's VANISHED (its patch 0004).
imap-proto = { git = "https://github.com/pinaltech/Picacho-Patches", branch = "vendor-split-dev" }
# Maximized windows' content is no longer a resize edge.
gpui-component = { git = "https://github.com/pinaltech/Picacho-Patches", branch = "vendor-split-dev" }
# Backdrop blur (`Window::paint_backdrop_blur`), drawn by the wgpu renderer
# (Linux), for the closing cover. TEMPORARY, as blitz-dom above: the
# fix/blitz-table-block-children branch, pinned, until it is merged.
gpui-pre = { git = "https://github.com/juliaoverflow/Picacho-Patches", rev = "382f207c209d1fcb3946cfb0aee492df2172d36a" }
gpui-pre-wgpu = { git = "https://github.com/juliaoverflow/Picacho-Patches", rev = "382f207c209d1fcb3946cfb0aee492df2172d36a" }

# Proton push notifications: Android messaging tokens registered against
# their Firebase installation (see the folder's README). A [patch] only
# applies from the top-level workspace, so it must be here rather than in
# protected_email_bridge.
# TEMPORARY, as blitz above: that branch's gpui-mobile, pinned, with its
# password keyboard (patch 0003, `KeyboardType::Password`), until merged;
