[package]
name = "picacho"
version = "0.1.0"
edition = "2024"
description = "Picacho: a fast, native email client for macOS, Windows, and Linux"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
hkdf = "0.12"
imap = "2.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls", "hostname"] }
mailparse = "0.16"
native-tls = "0.2"
notify-rust = "4"
open = "5"
pgp = "0.21"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[features]
# Offers a fictional sample inbox from onboarding, for development and screenshots.
sample-data = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0

