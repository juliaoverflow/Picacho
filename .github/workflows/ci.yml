# The check for dev and every pull request. Only beta and stable deploy
# (release.yml).
name: CI

on:
  push:
    branches: [dev]
  pull_request:

# Tests need nothing but to read the code.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Crates come from this repository or a published source
        run: sh scripts/check-patches.sh
      - name: Test
        run: cargo test --locked
