# Builds Picacho for Android (APKs), Linux (Flatpak) and Windows (an unsigned
# MSI), publishes the first two to Picacho's own repositories on Cloudflare
# R2, and creates the GitHub release with all three.
#
#   push to beta     the rolling beta: "Beta Build", no version number. The
#                    Android app tech.pinal.picacho.beta (beside the release),
#                    Flatpak branch "beta", and the GitHub pre-release
#                    "beta-build" (a tag apart from the branch's name),
#                    replaced on every push.
#   push to stable   a release of Cargo.toml's version X.Y.Z: the Android app
#                    tech.pinal.picacho, Flatpak branch "stable", and the
#                    GitHub release vX.Y.Z, which tags the commit. The version
#                    must have a dated CHANGELOG.md section, and vX.Y.Z must
#                    not tag any other commit (stable-pr.yml checks this
#                    before a pull request into stable can merge).
#
# Pull requests that touch the packaging build both formats without publishing.
# Repositories: https://android.repo.pinal.tech/repo, https://linux.repo.pinal.tech/repo/
name: Release

on:
  push:
    branches: [beta, stable]
  workflow_dispatch:
    inputs:
      channel:
        description: "Branch to (re)build and publish"
        required: true
        type: choice
        options: [beta, stable]
  pull_request:
    paths:
      - android/**
      - packaging/**
      - fdroid/**
      - scripts/build-android.sh
      - scripts/bundle-windows.ps1
      - .config/dotnet-tools.json
      - scripts/release/**
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  # The publish jobs rewrite the repositories' indexes: one release at a time.
  # Pull request builds publish nothing and run on their own.
  group: ${{ github.event_name == 'pull_request' && format('release-check-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.100.0"
  # beta, stable, or check (a pull request: build only).
  CHANNEL: ${{ inputs.channel || (github.event_name == 'push' && github.ref_name) || 'check' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      channel: ${{ env.CHANNEL }}
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
      tag: ${{ steps.version.outputs.tag }}
      branch: ${{ steps.version.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.channel || github.sha }}
          fetch-depth: 0
      - name: Crates come from this repository or a published source
        run: sh scripts/check-patches.sh
      - id: version
        run: |
          sha=$(git rev-parse HEAD)
          crate=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          case "$CHANNEL" in
            stable)
              case "$crate" in
                *-*) echo "::error::A stable release needs a plain X.Y.Z version, not $crate"; exit 1 ;;
              esac
              python3 scripts/release/changelog.py check "$crate"
              tag="v$crate"
              if tagged=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
                if [ "$tagged" != "$sha" ]; then
                  echo "::error::$tag already tags $tagged; set a new version in Cargo.toml"
                  exit 1
                fi
              fi
              {
                echo "publish=true"
                echo "version=$crate"
                echo "label=$crate"
                echo "tag=$tag"
                echo "branch=stable"
              } >> "$GITHUB_OUTPUT"
              ;;
            beta)
              # The rolling beta's version code is this workflow's run number.
              {
                echo "publish=true"
                echo "version=${{ github.run_number }}"
                echo "label=beta"
                echo "tag=beta-build"
                echo "branch=beta"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              {
                echo "publish=false"
                echo "version=$crate"
                echo "label=$crate"
                echo "tag="
                echo "branch=stable"
              } >> "$GITHUB_OUTPUT"
              ;;
          esac

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Build APKs
        env:
          # Only builds that publish get the release key: a pull request's
          # build runs the pull request's code (build scripts, Gradle), which
          # must never see it.
          PICACHO_KEYSTORE_BASE64: ${{ needs.prepare.outputs.publish == 'true' && secrets.PICACHO_KEYSTORE_BASE64 || '' }}
          PICACHO_KEYSTORE_PASSWORD: ${{ needs.prepare.outputs.publish == 'true' && secrets.PICACHO_KEYSTORE_PASSWORD || '' }}
          PICACHO_KEY_PASSWORD: ${{ needs.prepare.outputs.publish == 'true' && secrets.PICACHO_KEYSTORE_PASSWORD || '' }}
          PICACHO_KEY_ALIAS: picacho
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          # "beta" makes the app Picacho Beta, its version "Beta Build".
          PICACHO_CHANNEL: ${{ needs.prepare.outputs.channel == 'beta' && 'beta' || '' }}
          PICACHO_BUILD_NUMBER: ${{ needs.prepare.outputs.version }}
          # Optional pin: the release certificate's SHA-256 digest (hex).
          PICACHO_CERT_SHA256: ${{ vars.PICACHO_CERT_SHA256 }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          # Pull requests build with the debug key; releases need the release key.
          if [ -n "$PICACHO_KEYSTORE_BASE64" ]; then
            export PICACHO_KEYSTORE="$RUNNER_TEMP/picacho-release.jks"
            printf '%s' "$PICACHO_KEYSTORE_BASE64" | base64 -d > "$PICACHO_KEYSTORE"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::The PICACHO_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          # The release certificate's digest, from the keystore (and the pin,
          # when set), to compare each APK's signer against.
          expected=
          if [ "$PUBLISH" = true ]; then
            # Step by step: without pipefail, a failed export would give the
            # digest of nothing.
            if ! keytool -exportcert -alias "$PICACHO_KEY_ALIAS" -keystore "$PICACHO_KEYSTORE" \
                -storepass:env PICACHO_KEYSTORE_PASSWORD -file "$RUNNER_TEMP/release.der" \
              || [ ! -s "$RUNNER_TEMP/release.der" ]; then
              echo "::error::Could not read the release certificate"
              exit 1
            fi
            expected=$(sha256sum "$RUNNER_TEMP/release.der" | cut -d' ' -f1)
            rm -f "$RUNNER_TEMP/release.der"
            pin=$(printf '%s' "$PICACHO_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
            if [ -n "$pin" ] && [ "$pin" != "$expected" ]; then
              echo "::error::The release keystore's certificate is not the pinned one"
              exit 1
            fi
          fi
          sh scripts/build-android.sh
          rm -f "$RUNNER_TEMP/picacho-release.jks"
          mkdir -p out
          label=${{ needs.prepare.outputs.label }}
          for abi in arm64-v8a x86_64; do
            cp "android/app/build/outputs/apk/release/app-$abi-release.apk" "out/picacho-$label-$abi.apk"
          done
          # Fails the release if an APK is signed with anything but the release key.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          for apk in out/*.apk; do
            "$apksigner" verify --print-certs "$apk" > signer.txt
            if [ "$PUBLISH" = true ]; then
              # Exactly one signer, whose certificate is the release key's.
              digests=$(grep 'certificate SHA-256 digest:' signer.txt | awk '{print $NF}' | tr 'A-F' 'a-f')
              if [ "$(printf '%s\n' "$digests" | grep -c .)" != 1 ] || [ "$digests" != "$expected" ]; then
                echo "::error::$apk is not signed with the release key"
                cat signer.txt
                exit 1
              fi
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  flatpak:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('packaging/flatpak/tech.pinal.picacho.yml') }}
          restore-keys: flatpak-builder-${{ matrix.arch }}-
      - name: Build
        run: |
          branch=${{ needs.prepare.outputs.branch }}
          label=${{ needs.prepare.outputs.label }}
          manifest=packaging/flatpak/tech.pinal.picacho.yml
          if [ "${{ needs.prepare.outputs.channel }}" = beta ]; then
            # The beta calls itself "Beta Build" (PICACHO_CHANNEL at compile time).
            sed -i 's/^      env:$/      env:\n        PICACHO_CHANNEL: beta/' "$manifest"
            grep -q "PICACHO_CHANNEL: beta" "$manifest"
          fi
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --arch=${{ matrix.arch }} --default-branch="$branch" --repo=build-repo \
            build-dir "$manifest"
          mkdir -p out
          flatpak build-bundle --arch=${{ matrix.arch }} \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            build-repo "out/picacho-$label-${{ matrix.arch }}.flatpak" tech.pinal.picacho "$branch"
          tar -cf "out/build-repo-${{ matrix.arch }}.tar" build-repo
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the MSI
        shell: pwsh
        env:
          # "beta" makes the app Picacho Beta, its version "Beta Build".
          PICACHO_CHANNEL: ${{ needs.prepare.outputs.channel == 'beta' && 'beta' || '' }}
        run: |
          # The runner's Visual Studio build tools, Windows SDK (fxc.exe,
          # RC.EXE) and Strawberry Perl (OpenSSL) are what the script needs.
          # Unsigned: no PICACHO_SIGNTOOL_CERT, so SmartScreen warns.
          if (-not $env:PICACHO_CHANNEL) { Remove-Item Env:PICACHO_CHANNEL -ErrorAction SilentlyContinue }
          & scripts\bundle-windows.ps1 release
          $label = "${{ needs.prepare.outputs.label }}"
          New-Item -ItemType Directory -Force out | Out-Null
          # dist\Picacho-<version>-x64[-<culture>].msi -> out\picacho-<label>-x64[-<culture>].msi
          $msis = Get-ChildItem dist\Picacho-*-x64*.msi
          if (-not $msis) { throw "No MSI was built" }
          foreach ($msi in $msis) {
            $suffix = $msi.Name -replace '^Picacho-.+-x64(.*)\.msi$', '$1'
            Copy-Item $msi.FullName "out\picacho-$label-x64$suffix.msi"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.msi
          if-no-files-found: error

  publish-android:
    needs: [prepare, android]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: out
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q rclone librsvg2-bin
          pip install --quiet fdroidserver==2.4.5
      - name: Publish to android.repo.pinal.tech
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        run: sh scripts/release/publish-fdroid.sh ${{ needs.prepare.outputs.channel }} ${{ needs.prepare.outputs.version }} out/*.apk

  publish-linux:
    needs: [prepare, flatpak]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: flatpak-*
          path: out
          merge-multiple: true
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q rclone flatpak ostree
      - name: Publish to linux.repo.pinal.tech
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: 0996483F6998AB8722D3866FF094B0B445C2E4CD
        run: |
          repos=""
          for arch in x86_64 aarch64; do
            mkdir -p "build/$arch"
            tar -xf "out/build-repo-$arch.tar" -C "build/$arch"
            repos="$repos build/$arch/build-repo"
          done
          sh scripts/release/publish-flatpak.sh $repos

  github-release:
    needs: [prepare, android, flatpak, windows, publish-android, publish-linux]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          install='
          ### Install

          **Android:** add `https://android.repo.pinal.tech/repo?fingerprint=a029e7fcd4c66d85aa0baea0f87db04c854c559f056a8b2032b4b26d186ee9d5` in F-Droid, Droid-ify or Neo Store and install Picacho (or Picacho Beta), or install an APK below (`arm64-v8a` for most phones).

          **Linux:** `flatpak install --from https://linux.repo.pinal.tech/tech.pinal.picacho.stable.flatpakref` (beta: `tech.pinal.picacho.beta.flatpakref`), or install a `.flatpak` bundle below.

          **Windows:** download the `.msi` below, which installs for the current user without administrator rights. It is not code-signed yet, so SmartScreen may warn: choose **More info**, then **Run anyway**.'
          assets="out/*.apk out/*.flatpak out/*.msi"
          if [ "${{ needs.prepare.outputs.channel }}" = beta ]; then
            # One rolling pre-release: replace the last beta and move its tag.
            {
              echo "The rolling beta of Picacho, built from \`${SHA}\` on the beta branch. It has no version number and installs beside the release as Picacho Beta."
              echo "$install"
            } > notes.md
            # (The first betas used the tag "beta", which the branch shares.)
            for old in "$TAG" beta; do
              gh release delete "$old" --yes --cleanup-tag 2>/dev/null || true
            done
            gh release create "$TAG" $assets --target "$SHA" \
              --title "Picacho Beta Build" --notes-file notes.md --prerelease --latest=false
          else
            version=${{ needs.prepare.outputs.version }}
            {
              python3 scripts/release/changelog.py notes "$version"
              echo "$install"
            } > notes.md
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" $assets --clobber
              gh release edit "$TAG" --notes-file notes.md
            elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              gh release create "$TAG" $assets --title "Picacho $version" --notes-file notes.md --verify-tag
            else
              # Tags the commit only now that it has been published.
              gh release create "$TAG" $assets --target "$SHA" --title "Picacho $version" --notes-file notes.md
            fi
          fi
