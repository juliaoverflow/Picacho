# Picacho's Flatpak, published to Picacho's own repository at
# https://linux.repo.pinal.tech (see .github/workflows/release.yml).
#
# Local build (from the repository root):
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/tech.pinal.picacho.yml
id: tech.pinal.picacho
# GNOME's runtime (built on the Freedesktop one) for WebKitGTK 4.1, which
# shows Proton's human verification (wry, display/verify.rs).
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
# libclang, for bindgen (fido-hid-rs, the USB security keys).
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm23
command: picacho
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU rendering, and USB security keys for passkey sign-in (all includes
  # dri). Security keys are hidraw devices, which only --device=all exposes;
  # a narrower --device=dri would leave them out.
  - --device=all
  # Credentials live in the Secret Service (GNOME Keyring, KWallet).
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  # The tray icon while Picacho runs in the background (StatusNotifierItem).
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: picacho
    buildsystem: simple
    build-options:
      # Picacho needs Rust 1.100 or later, newer than the SDK's Rust extension,
      # so the build installs that toolchain with rustup and lets cargo fetch
      # the locked crates. Only for this repository; Flathub builds offline.
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/picacho/.cargo
        RUSTUP_HOME: /run/build/picacho/.rustup
        LIBCLANG_PATH: /usr/lib/sdk/llvm23/lib
        # bindgen asks clang for its built-in headers (stddef.h).
        CLANG_PATH: /usr/lib/sdk/llvm23/bin/clang
      # The release profile already leaves symbols out; no .Debug extension.
      no-debuginfo: true
      append-path: /usr/lib/sdk/llvm23/bin
    build-commands:
      # rustup-init 1.28.2, checked against its published SHA-256 before it
      # runs (a script piped from the network was run unchecked).
      - |
        case "$(uname -m)" in
          x86_64) sum=20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c ;;
          aarch64) sum=e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c ;;
          *) echo "no checked rustup-init for $(uname -m)" >&2; exit 1 ;;
        esac
        curl --proto '=https' --tlsv1.2 -sSf -o rustup-init \
          "https://static.rust-lang.org/rustup/archive/1.28.2/$(uname -m)-unknown-linux-gnu/rustup-init"
        echo "$sum  rustup-init" | sha256sum -c -
        chmod +x rustup-init
        ./rustup-init -y --profile minimal --default-toolchain 1.100.0 --no-modify-path
      - $CARGO_HOME/bin/cargo build --release --locked
      - install -Dm755 target/release/picacho /app/bin/picacho
      - install -Dm644 packaging/linux/tech.pinal.picacho.svg /app/share/icons/hicolor/scalable/apps/tech.pinal.picacho.svg
      # The desktop entry and listing with their translations (locales/).
      - python3 scripts/release/l10n.py desktop packaging/flatpak/tech.pinal.picacho.desktop /app/share/applications/tech.pinal.picacho.desktop
      - python3 scripts/release/l10n.py metainfo packaging/flatpak/tech.pinal.picacho.metainfo.xml metainfo.xml
      - python3 scripts/release/changelog.py metainfo metainfo.xml /app/share/metainfo/tech.pinal.picacho.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - dist
          - android
          - build-dir
          - .flatpak-builder
          - build-repo
          - build
          - out
          - fdroid
