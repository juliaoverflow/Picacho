# The Xcode host app for Picacho on iOS. Generated into Picacho.xcodeproj by
# XcodeGen (`brew install xcodegen`); scripts/bundle-ios.sh builds the Rust
# library, generates the project and builds, signs and installs the app.
name: Picacho
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # Which Cargo profile's libpicacho.a to link: release or debug.
    RUST_PROFILE: release
targets:
  Picacho:
    type: application
    platform: iOS
    sources:
      - main.m
      - Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Picacho
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: tech.pinal.picacho.sign-in
            CFBundleURLSchemes: [picacho]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: Picacho
        PRODUCT_BUNDLE_IDENTIFIER: tech.pinal.picacho
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_ENABLE_OBJC_ARC: YES
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/../../target/aarch64-apple-ios/$(RUST_PROFILE)
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/$(RUST_PROFILE)
        "ARCHS[sdk=iphonesimulator*]": arm64
        OTHER_LDFLAGS:
          - -lpicacho
          - -lc++
          - -lresolv
          - -framework
          - UIKit
          - -framework
          - QuartzCore
          - -framework
          - Metal
          - -framework
          - CoreText
          - -framework
          - CoreGraphics
          - -framework
          - CoreFoundation
          - -framework
          - CoreVideo
          - -framework
          - Security
          - -framework
          - SystemConfiguration
          # Haptics (gpui-mobile's `vibration`): AudioServicesPlaySystemSound.
          - -framework
          - AudioToolbox
