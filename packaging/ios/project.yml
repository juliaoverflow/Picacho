# The Xcode host app for Picacho on iOS. Generated into Picacho.xcodeproj by
# XcodeGen (`brew install xcodegen`); scripts/bundle-ios.sh builds the Rust
# library, generates the project and builds, signs and installs the app.
name: Picacho
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # Which Cargo profile's libpicacho.a to link: release or debug.
    RUST_PROFILE: release
    # Shared across Picacho and its PicachoWidgets and PicachoShare
    # extensions so App Group IDs and the extensions' bundle IDs follow
    # `PICACHO_IOS_BUNDLE_ID`.
    PICACHO_BUNDLE_ID: tech.pinal.picacho
    SWIFT_VERSION: "5.9"
targets:
  Picacho:
    type: application
    platform: iOS
    sources:
      - main.m
      - PicachoBridge.h
      - Bridge.swift
      - Lifecycle.swift
      - WidgetBridge.swift
      # System notifications, with Mark as Read, Archive, Delete and Reply.
      - Notifications.swift
      # Checking for mail in the background (background app refresh).
      - BackgroundRefresh.swift
      # Proton's human verification (CAPTCHA), in a WKWebView sheet.
      - Verify.swift
      # Proton's security keys over NFC (Core NFC).
      - SecurityKeys.swift
      # What the Share extension hands over.
      - Shares.swift
      - Assets.xcassets
      # The permission prompts' text (Info.plist's usage descriptions), by
      # language. The extensions' text is in their folders' Localizable.xcstrings.
      - InfoPlist.xcstrings
    dependencies:
      - target: PicachoWidgets
        embed: true
      - target: PicachoShare
        embed: true
    entitlements:
      path: Picacho.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(PICACHO_BUNDLE_ID)
        # Security keys held to the iPhone (SecurityKeys.swift).
        com.apple.developer.nfc.readersession.formats:
          - TAG
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Picacho
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The languages Picacho has (locales/), so iOS offers them in its
        # per-app language setting. A test (src/i18n/tests.rs) keeps this
        # list the same as Picacho's.
        CFBundleLocalizations: [en]
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: tech.pinal.picacho.sign-in
            # The bundle ID's own too: the Share extension opens Picacho
            # with it (<bundle ID>://share/<id>).
            CFBundleURLSchemes: [picacho, tech.pinal.picacho, $(PICACHO_BUNDLE_ID)]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The app lock's Face ID unlock (src/display/biometric.rs).
        NSFaceIDUsageDescription: Picacho uses Face ID to unlock your mail when the app lock is on.
        # Checking for mail in the background (BackgroundRefresh.swift).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - $(PICACHO_BUNDLE_ID).refresh
        # Proton's security keys, held to the iPhone (SecurityKeys.swift):
        # tags with the FIDO applet (CTAP 2.1 §11.3.3).
        NFCReaderUsageDescription: Picacho reads your security key when you hold it to your iPhone to sign in.
        com.apple.developer.nfc.readersession.iso7816.select-identifiers:
          - A0000006472F0001
        # A passkey on another device, by QR code: Bluetooth tells it's
        # nearby (caBLE, src/sync/fido.rs).
        NSBluetoothAlwaysUsageDescription: Picacho uses Bluetooth to check that the phone or tablet with your passkey is nearby when you sign in with it.
    settings:
      base:
        PRODUCT_NAME: Picacho
        PRODUCT_BUNDLE_IDENTIFIER: $(PICACHO_BUNDLE_ID)
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_ENABLE_OBJC_ARC: YES
        # Swift's calls into the Rust library.
        SWIFT_OBJC_BRIDGING_HEADER: PicachoBridge.h
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/../../target/aarch64-apple-ios/$(RUST_PROFILE)
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/$(RUST_PROFILE)
        "ARCHS[sdk=iphonesimulator*]": arm64
        OTHER_LDFLAGS:
          - -lpicacho
          - -lc++
          - -lresolv
          - -framework
          - UIKit
          - -framework
          - QuartzCore
          - -framework
          - Metal
          - -framework
          - CoreText
          - -framework
          - CoreGraphics
          - -framework
          - CoreFoundation
          - -framework
          - CoreVideo
          - -framework
          - Security
          - -framework
          - SystemConfiguration
          # Haptics (gpui-mobile's `vibration`): AudioServicesPlaySystemSound.
          - -framework
          - AudioToolbox
          # Home-screen widget timeline reloads (WidgetBridge.swift).
          - -framework
          - WidgetKit
          # The app lock's Face ID and Touch ID (src/display/biometric.rs).
          - -framework
          - LocalAuthentication
          # Notifications (Notifications.swift) and background refresh
          # (BackgroundRefresh.swift).
          - -framework
          - UserNotifications
          - -framework
          - BackgroundTasks
          # Proton's human verification (Verify.swift).
          - -framework
          - WebKit
          # A passkey on another device: caBLE's Bluetooth (btleplug).
          - -framework
          - CoreBluetooth
          # Security keys over NFC (SecurityKeys.swift); iPads have none.
          - -weak_framework
          - CoreNFC
          # Mail in Spotlight (src/manage/system_search/spotlight.rs, and
          # main.m's results chosen).
          - -framework
          - CoreSpotlight

  # The Share sheet's Picacho: shared text, links and files start a message
  # (ShareExtension/ShareViewController.swift, Shares.swift).
  PicachoShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - "*.entitlements"
      # The language Picacho shows, shared with the widgets.
      - Shared/PicachoLanguage.swift
    entitlements:
      path: ShareExtension/PicachoShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(PICACHO_BUNDLE_ID)
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Picacho
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 20
    settings:
      base:
        PRODUCT_NAME: PicachoShare
        PRODUCT_BUNDLE_IDENTIFIER: $(PICACHO_BUNDLE_ID).share
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  PicachoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "*.entitlements"
      # The language Picacho shows, shared with the Share extension.
      - Shared/PicachoLanguage.swift
    entitlements:
      path: Widgets/PicachoWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(PICACHO_BUNDLE_ID)
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Picacho Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: PicachoWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(PICACHO_BUNDLE_ID).widgets
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
