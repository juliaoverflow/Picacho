# The Xcode host app for Picacho on iOS. Generated into Picacho.xcodeproj by
# XcodeGen (`brew install xcodegen`); scripts/bundle-ios.sh builds the Rust
# library, generates the project and builds, signs and installs the app.
name: Picacho
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # Which Cargo profile's libpicacho.a to link: release or debug.
    RUST_PROFILE: release
    # Shared across Picacho and its PicachoWidgets extension so App Group IDs
    # and the extension's bundle ID follow `PICACHO_IOS_BUNDLE_ID`.
    PICACHO_BUNDLE_ID: tech.pinal.picacho
    SWIFT_VERSION: "5.9"
targets:
  Picacho:
    type: application
    platform: iOS
    sources:
      - main.m
      - WidgetBridge.swift
      - Assets.xcassets
    dependencies:
      - target: PicachoWidgets
        embed: true
    entitlements:
      path: Picacho.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(PICACHO_BUNDLE_ID)
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Picacho
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: tech.pinal.picacho.sign-in
            CFBundleURLSchemes: [picacho, tech.pinal.picacho]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The app lock's Face ID unlock (src/display/biometric.rs).
        NSFaceIDUsageDescription: Picacho uses Face ID to unlock your mail when the app lock is on.
    settings:
      base:
        PRODUCT_NAME: Picacho
        PRODUCT_BUNDLE_IDENTIFIER: $(PICACHO_BUNDLE_ID)
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_ENABLE_OBJC_ARC: YES
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/../../target/aarch64-apple-ios/$(RUST_PROFILE)
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/$(RUST_PROFILE)
        "ARCHS[sdk=iphonesimulator*]": arm64
        OTHER_LDFLAGS:
          - -lpicacho
          - -lc++
          - -lresolv
          - -framework
          - UIKit
          - -framework
          - QuartzCore
          - -framework
          - Metal
          - -framework
          - CoreText
          - -framework
          - CoreGraphics
          - -framework
          - CoreFoundation
          - -framework
          - CoreVideo
          - -framework
          - Security
          - -framework
          - SystemConfiguration
          # Haptics (gpui-mobile's `vibration`): AudioServicesPlaySystemSound.
          - -framework
          - AudioToolbox
          # Home-screen widget timeline reloads (WidgetBridge.swift).
          - -framework
          - WidgetKit
          # The app lock's Face ID and Touch ID (src/display/biometric.rs).
          - -framework
          - LocalAuthentication
  PicachoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "*.entitlements"
    entitlements:
      path: Widgets/PicachoWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(PICACHO_BUNDLE_ID)
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Picacho Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: PicachoWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(PICACHO_BUNDLE_ID).widgets
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
