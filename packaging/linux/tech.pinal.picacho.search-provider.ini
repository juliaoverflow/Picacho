# GNOME Shell's search asks Picacho for mail as one types, over D-Bus
# (src/manage/system_search/desktop_search.rs), while Picacho runs and
# Settings → Privacy → Show mail in desktop search is on. GNOME reads this
# from the system's data folders only: /usr/share or the Flatpak's exports.
[Shell Search Provider]
DesktopId=tech.pinal.picacho.desktop
BusName=tech.pinal.picacho.SearchProvider
ObjectPath=/tech/pinal/picacho/SearchProvider
Version=2
